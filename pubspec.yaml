name: jil_std_app
description: Std 11,12 A Science - Production-Ready Educational App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  http: ^1.1.0
  pdf: ^3.10.0
  printing: ^5.11.0
  path_provider: ^2.1.0
  image_picker: ^1.0.0
  permission_handler: ^11.4.0
  intl: ^0.19.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  connectivity_plus: ^5.0.0
  qr_flutter: ^4.1.0
  youtube_player_flutter: ^8.1.0
  video_player: ^2.7.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
